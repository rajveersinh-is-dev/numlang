[package]
name = "numlang"
version = "0.1.0"
edition = "2021"
authors = ["numlang team"]
description = "A fast, statically typed compiled programming language for numerical computing"

[dependencies]
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"

[[bin]]
name = "numlang"
path = "src/main.rs"

[lib]
name = "numlang"
path = "src/lib.rs"
