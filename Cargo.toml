[package]
name = "numlang"
version = "0.1.0"
edition = "2021"
authors = ["Rajveersinh Pardeshi"]
description = "A fast, statically typed compiled programming language for numerical computing"
default-run = "numlang"

[dependencies]
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-object = "0.135"
cranelift-native = "0.135"
target-lexicon = "0.13"
inkwell = { version = "0.5.0", features = ["llvm18-0"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
proptest = "1.11.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "supercompiler_benchmarks"
harness = false

[features]
default = []
llvm-backend = ["dep:inkwell"]

[[bin]]
name = "numlang"
path = "src/main.rs"

[[bin]]
name = "minspec_cogen"
path = "src/bin/minspec_cogen.rs"

[lib]
name = "numlang"
path = "src/lib.rs"

[[test]]
name = "supercompiler_showdown"
path = "tests/supercompiler_showdown.rs"

