[package]
name = "numlang"
version = "0.1.0"
edition = "2021"
authors = ["numlang team"]
description = "A fast, statically typed compiled programming language for numerical computing"

[dependencies]
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-object = "0.135"
cranelift-native = "0.135"
target-lexicon = "0.13"

[[bin]]
name = "numlang"
path = "src/main.rs"

[lib]
name = "numlang"
path = "src/lib.rs"
