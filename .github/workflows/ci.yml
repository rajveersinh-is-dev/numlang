name: CI

on:
  push:
    branches: [ "master", "honesty-overhaul" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Run Clippy (Zero Warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test
        env:
          QUICK_BENCHMARKS: "1"
          DIFF_VALIDATION_COUNT: "50"
          LEAN_VALIDATION_COUNT: "50"

      - name: Run Integrity Lint Test
        run: cargo test --test integrity_lint

      - name: Build Documentation (Zero Warnings)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run Hostile Claims Linter
        run: python scripts/claims_lint.py
