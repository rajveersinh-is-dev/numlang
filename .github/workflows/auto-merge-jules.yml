name: Auto-merge Jules PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-jules-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and detect Jules
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR" \
            --jq '{num:.number,state:.state,head:.head.ref,base:.base.ref,draft:.draft}' > /tmp/pr.json
          cat /tmp/pr.json
          NUM=$(jq -r .num /tmp/pr.json)
          HEAD=$(jq -r .head /tmp/pr.json)

          # A Jules PR is one whose branch mentions jules, or that carries a
          # commit authored by the Jules bot.
          BR_JULES=false
          case "$HEAD" in *jules*) BR_JULES=true ;; esac
          COMMIT_JULES=$(gh api "repos/${{ github.repository }}/pulls/$NUM/commits" \
            --jq '[.[] | select((.commit.author.email // "") | test("jules"; "i"))] | length' 2>/dev/null || echo 0)
          IS_JULES=false
          if [ "$BR_JULES" = "true" ] || [ "${COMMIT_JULES:-0}" -gt 0 ]; then IS_JULES=true; fi
          echo "detected: branch_jules=$BR_JULES jules_commits=$COMMIT_JULES is_jules=$IS_JULES"

          echo "num=$NUM"                                >> "$GITHUB_OUTPUT"
          echo "head=$HEAD"                              >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base /tmp/pr.json)"        >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state /tmp/pr.json)"      >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r .draft /tmp/pr.json)"      >> "$GITHUB_OUTPUT"
          echo "is_jules=$IS_JULES"                      >> "$GITHUB_OUTPUT"

      - name: Checkout base
        if: steps.pr.outputs.is_jules == 'true' && steps.pr.outputs.state == 'open' && steps.pr.outputs.draft == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_PAT }}

      - name: Merge as me and delete branch
        if: steps.pr.outputs.is_jules == 'true' && steps.pr.outputs.state == 'open' && steps.pr.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          PR: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          git config user.name  "rajveersinh-is-dev"
          git config user.email "daveaddams91@gmail.com"
          export GIT_AUTHOR_NAME="rajveersinh-is-dev"   GIT_AUTHOR_EMAIL="daveaddams91@gmail.com"
          export GIT_COMMITTER_NAME="rajveersinh-is-dev" GIT_COMMITTER_EMAIL="daveaddams91@gmail.com"

          git fetch origin "$HEAD_REF" "$BASE_REF"
          git checkout -B automerge-pr "origin/$HEAD_REF"

          # Rewrite the PR's own commits so everything lands authored by me.
          git rebase "origin/$BASE_REF" --exec 'git commit --amend --no-edit --reset-author'

          # Push the rewritten branch back so GitHub still records the PR as merged.
          git push --force origin "automerge-pr:$HEAD_REF"

          # Merge with a merge commit authored by me.
          git checkout "$BASE_REF"
          git merge --no-ff -m "Merge pull request #$PR from $HEAD_REF" automerge-pr
          git push origin "$BASE_REF"

          # Delete the head branch.
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$HEAD_REF" || true
