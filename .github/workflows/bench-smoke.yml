name: Benchmark Smoke Verification

on:
  push:
    branches: [ "master", "honesty-overhaul" ]
  pull_request:
    branches: [ "master" ]

jobs:
  bench_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Smoke Verification Tests
        env:
          QUICK_BENCHMARKS: "1"
        run: |
          cargo test --test structural_generality_tests
          cargo test --test general_recurrence_tests
          cargo test --test integrity_lint

      - name: Run Benchmark Table Generator (Check-Only)
        run: python scripts/make_bench_table.py --check

      - name: Run CI Runtime Regression Guard
        run: python scripts/ci_regression_guard.py
