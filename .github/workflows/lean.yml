name: Lean 4 Proof Verification

on:
  push:
    branches: [ "master", "honesty-overhaul", "honesty-round2" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify_proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan (Lean toolchain manager)
        run: |
          set -o pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build and Verify Lean Package (lean/)
        working-directory: ./lean
        run: lake build

      - name: Build and Verify Lean Package (proof/)
        working-directory: ./proof
        run: lake build

      - name: Run Lean Axiom Introspection Check
        run: python scripts/check_lean_axioms.py

      - name: Run Lean Documentation Honesty Check
        run: python scripts/check_lean_docs.py

      - name: Check for sorry and axiom usage
        run: |
          if grep -rn --exclude-dir=".lake" "sorry" lean/ proof/ ; then
            echo "Error: Found 'sorry' in Lean proofs!"
            exit 1
          fi
          if grep -rn --exclude-dir=".lake" "axiom " lean/ proof/ ; then
            echo "Error: Found unproven 'axiom' in Lean proofs!"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Lean 4 Bridge & Operational Model Cross-Validation
        run: |
          cargo test --test constructive_lean4_phase42_tests
          cargo test --test supercompiler_phase38_tests
          cargo test --test differential_validation_tests test_lean_model_cross_validation_1k
