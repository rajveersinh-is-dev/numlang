# NumLang Supercompiler Showdown: Canonical Benchmark Registry
# Governed by INTEGRITY_RULES.md - zero precomputed numbers, real dynamic execution

[metadata]
version = "1.0.0"
title = "Supercompiler Canonical Literature Benchmark Registry"

# ==============================================================================
# GROUP 1: Classical Functional Deforestation (Wadler 1990, Hamilton 2007)
# ==============================================================================

[[benchmark]]
id = "nrev"
group = "G1: Deforestation"
name = "Naive Reverse (Double nrev)"
algorithm = "nrev(nrev(xs)) on singly linked lists"
transformation = "Deforest intermediate list into identity traversal"
expected_gain = "O(N^2) -> O(N)"
expected_exit = 224
numlang = "bench/showdown/numlang/nrev.nl"
haskell = "bench/showdown/haskell/nrev.hs"
hosc = "bench/showdown/hosc/nrev.hosc"
c = "bench/showdown/c/nrev.c"
rust = "bench/showdown/rust/nrev.rs"

